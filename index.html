<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Finanzas Personal</title>
  <meta name="description" content="Control de gastos e inversión personal: presupuesto por categorías, seguimiento de aportes y patrimonio total." />
  <meta name="theme-color" content="#080a0c" />
  <meta name="color-scheme" content="dark" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#inicio" aria-label="Finanzas Personal — Inicio">
      <span class="brand-mark" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/>
        </svg>
      </span>
      <span class="brand-text"><strong>Finanzas</strong><small>Personal</small></span>
    </a>

    <nav id="tabs" aria-label="Navegación principal">
      <button class="tab active" data-tab="inicio" type="button">
        <span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.7 12 3l9 7.7"/><path d="M5.5 9.5V21h13V9.5"/><path d="M9.5 21v-6h5v6"/></svg></span>
        <span class="tab-label">Inicio</span>
      </button>
      <button class="tab" data-tab="gastos" type="button">
        <span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v17l-3-2-2 2-2-2-2 2-2-2-3 2V4a1 1 0 0 1 1-1Z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg></span>
        <span class="tab-label">Gastos</span>
      </button>
      <button class="tab" data-tab="patrimonio" type="button">
        <span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5"/><path d="m3 16 9 5 9-5"/></svg></span>
        <span class="tab-label">Patrimonio</span>
      </button>
      <button class="tab" data-tab="analisis" type="button">
        <span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5"/><path d="M4 19h16"/><path d="m7 15 4-5 3.5 2.5L20 6"/></svg></span>
        <span class="tab-label">Análisis</span>
      </button>
      <button class="tab" data-tab="objetivos" type="button">
        <span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><path d="M12 2v2M22 12h-2M12 20v2M2 12h2"/></svg></span>
        <span class="tab-label">Objetivos</span>
      </button>
      <button class="tab" data-tab="ajustes" type="button">
        <span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 12h2M10 12h10M4 17h8M16 17h4"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="14" cy="17" r="2"/></svg></span>
        <span class="tab-label">Ajustes</span>
      </button>
    </nav>

    <button class="btn btn-quick" id="btn-quick-gasto" type="button">
      <span class="icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
      Nuevo gasto
    </button>
  </header>

  <main id="view" aria-live="polite"></main>

  <div id="modal-root"></div>
  <div id="toast" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
